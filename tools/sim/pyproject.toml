[project]
name = "sim"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Grafton-LeGare", email = "glegare.software@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
sim = "sim:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["test"]
