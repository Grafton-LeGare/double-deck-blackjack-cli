name: release
on:
    push:
        tags: ['v*']

jobs:
    build:
        strategy:
            matrix:
                include:
                    # `config` is relative to apps/cli: SEA resolves the paths inside
                    # sea-config.json against the CWD, so that step runs there.
                    # `built`/`asset` are relative to the repo root.
                    - os: windows-latest
                      config: sea-config.win.json
                      built: apps/cli/dist/cli-blackjack.exe
                      asset: cli-blackjack-windows-x64.exe
                    # macOS ships a tarball, not a raw binary: release assets are plain
                    # HTTP downloads with no permission metadata, so the +x bit only
                    # survives inside an archive.
                    # This does NOT clear Gatekeeper — quarantine propagates through tar
                    # extraction, so an ad-hoc-signed binary is still blocked. Users must
                    # run `xattr -d com.apple.quarantine` until this is notarized.
                    - os: macos-latest
                      config: sea-config.json
                      built: apps/cli/dist/cli-blackjack
                      asset: cli-blackjack-macos-arm64.tar.gz
                    - os: ubuntu-latest
                      config: sea-config.json
                      built: apps/cli/dist/cli-blackjack
                      asset: cli-blackjack-linux-x64
        runs-on: ${{ matrix.os }}
        steps: 
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with: { node-version: 26, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter cli build
            - run: node --build-sea ${{ matrix.config }}
              working-directory: apps/cli
            - if: runner.os == 'macOS'
              run: codesign --sign - ${{ matrix.built }}
            # chmod before tar: upload-artifact normalizes files to 644, so the bit has
            # to already be recorded inside the archive to survive the round trip.
            - if: runner.os == 'macOS'
              shell: bash
              run: |
                chmod +x ${{ matrix.built }}
                tar czf ${{ matrix.asset }} -C apps/cli/dist cli-blackjack
            # Windows runs .exe by extension; Linux users chmod +x after download.
            - if: runner.os != 'macOS'
              shell: bash
              run: mv ${{ matrix.built }} ${{ matrix.asset }}
            - uses: actions/upload-artifact@v7
              with:
                name: ${{ matrix.asset }}
                path: ${{ matrix.asset }}
    
    release: 
        needs: build
        runs-on: ubuntu-latest
        permissions: { contents: write }
        steps:
            - uses: actions/download-artifact@v8
              with: { path: out, merge-multiple: true }
            - run: gh release create "$GITHUB_REF_NAME" out/* --generate-notes
              # GH_REPO because this job has no checkout, so gh has no git repo to infer from.
              env:
                GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                GH_REPO: "${{ github.repository }}"