name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    typescript:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with: 
                node-version: 24
                cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm -r test
            - run: pnpm -r typecheck
    
    python:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: tools/sim
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v7
              with: 
                enable-cache: true
            - run: uv sync --locked
            - run: uv run ruff check .
            - run: uv run pytest